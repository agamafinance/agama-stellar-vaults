[package]
name = "agama-private-credit-adapter"
description = "Allocation Engine adapter for an off-chain / cross-chain private credit position (Tenka tkUSD)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
agama-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
agama-oracle = { path = "../../contracts/oracle" }
