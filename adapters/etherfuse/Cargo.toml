[package]
name = "agama-etherfuse-adapter"
description = "Allocation Engine adapter holding Etherfuse Stablebonds (operator-settled via the Etherfuse API)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
agama-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
agama-oracle = { path = "../../contracts/oracle" }
