[workspace]
resolver = "2"
members = [
  "crates/agama-interfaces",
  "contracts/vault",
  "contracts/oracle",
  "contracts/allocation-engine",
  "adapters/private-credit",
  "adapters/etherfuse",
  "mocks/mock-stablebond",
  "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/agamafinance/agama-stellar-vaults"
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-tokens = "0.8.0"
stellar-access = "0.8.0"
stellar-contract-utils = "0.8.0"
stellar-macros = "0.8.0"
agama-interfaces = { path = "crates/agama-interfaces" }
proptest = "1.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
