[package]
name = "agama-oracle"
description = "SEP-40 push oracle for Agama NAV and price feeds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
