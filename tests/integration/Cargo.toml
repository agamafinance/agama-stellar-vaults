[package]
name = "agama-integration-tests"
description = "End-to-end tests of the Agama contracts wired together"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
agama-interfaces = { workspace = true }
agama-vault = { path = "../../contracts/vault" }
agama-oracle = { path = "../../contracts/oracle" }
agama-allocation-engine = { path = "../../contracts/allocation-engine" }
agama-private-credit-adapter = { path = "../../adapters/private-credit" }
agama-etherfuse-adapter = { path = "../../adapters/etherfuse" }
agama-mock-stablebond = { path = "../../mocks/mock-stablebond" }
